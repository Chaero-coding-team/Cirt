<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; font-family: sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; opacity: 0.7; margin: 0 0 12px; }
  button { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #2f80ed; background: #2f80ed; color: #fff; cursor: pointer; font-size: 13px; }
  button:hover { opacity: 0.9; }
  .muted { font-size: 11px; opacity: 0.6; margin-top: 10px; text-align:center; }
</style>
</head>
<body>
  <h1>🧩 OGS Plus</h1>
  <p id="tagline">Make OGS even more convenient</p>
  <button id="openSettings">Open Plus Settings</button>
  <div class="muted" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
